<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리 고양이 나이 · JYP COWRK</title>
<style>
:root{color-scheme:dark;--bg:#08090b;--card:#12151a;--line:#29313b;--text:#f7f8fa;--muted:#9eabb9;--mint:#6ee7c7;--blue:#69c8ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}
.wrap{width:min(920px,100%);margin:auto;padding:28px 20px 64px}
.back{display:inline-block;margin-bottom:28px;color:var(--muted);text-decoration:none;font-weight:700}
header{margin-bottom:24px}
.eyebrow{color:var(--mint);font-size:12px;font-weight:900;letter-spacing:.18em}
h1{font-size:clamp(34px,8vw,60px);margin:8px 0 10px;letter-spacing:-.055em}
.lead{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:26px}
.card{padding:22px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#151a20,#0e1115);box-shadow:0 14px 34px rgba(0,0,0,.24)}
.top{display:flex;align-items:center;justify-content:space-between}
.name{font-size:25px;font-weight:900}
.emoji{font-size:31px}
.age{margin:22px 0 6px;color:var(--mint);font-size:25px;font-weight:900;letter-spacing:-.04em}
.birth{color:var(--muted);font-size:14px}
.note{margin-top:22px;padding:15px 17px;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:13px;line-height:1.6}
@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding-top:20px}}
</style>
</head>
<body>
<main class="wrap">
<a class="back" href="index.html">← 대시보드</a>
<header>
<div class="eyebrow">OUR CATS · AGE RECORD</div>
<h1>우리 고양이 나이</h1>
<p class="lead" id="asOf"></p>
</header>
<section class="grid" id="cats"></section>
<div class="note">생년월일을 기준으로 만 나이를 자동 계산합니다. 페이지를 여는 날짜에 맞춰 나이가 갱신됩니다.</div>
</main>
<script>
const cats=[
  {name:"땅콩",birth:"2017-04-28",emoji:"🐈"},
  {name:"오레오",birth:"2021-03-20",emoji:"🐈‍⬛"},
  {name:"고소미",birth:"2022-05-30",emoji:"🐱"},
  {name:"밤",birth:"2024-10-15",emoji:"🐾"}
];
const today=new Date();
const parts=new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"numeric",day:"numeric"}).formatToParts(today);
const v=Object.fromEntries(parts.map(p=>[p.type,Number(p.value)]));
const now=new Date(v.year,v.month-1,v.day);
function age(birth){
  const b=new Date(birth+"T00:00:00");
  let y=now.getFullYear()-b.getFullYear();
  let m=now.getMonth()-b.getMonth();
  let d=now.getDate()-b.getDate();
  if(d<0){m--;d+=new Date(now.getFullYear(),now.getMonth(),0).getDate()}
  if(m<0){y--;m+=12}
  return {y,m,d};
}
document.getElementById("asOf").textContent=`${v.year}년 ${v.month}월 ${v.day}일 기준`;
document.getElementById("cats").innerHTML=cats.map(c=>{
  const a=age(c.birth);
  const [y,m,d]=c.birth.split("-");
  return `<article class="card"><div class="top"><span class="name">${c.name}</span><span class="emoji">${c.emoji}</span></div><div class="age">만 ${a.y}살 · ${a.m}개월 ${a.d}일</div><div class="birth">${y}년 ${Number(m)}월 ${Number(d)}일생</div></article>`;
}).join("");
</script>
</body>
</html>
