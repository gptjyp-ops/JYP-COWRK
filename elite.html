<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ELITE KOR 클랜 홍보글</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0f1115;color:#f5f7fb;font-family:system-ui,"Noto Sans KR",sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 16px}a{color:#8bd3ff}h1{font-size:24px}.card{margin-top:24px;padding:20px;background:#171a21;border:1px solid #2a2f3a;border-radius:14px}pre{white-space:pre-wrap;word-break:keep-all;font-family:inherit;font-size:17px;line-height:1.7}button{width:100%;padding:14px;border:0;border-radius:10px;background:#8bd3ff;color:#111;font-size:16px;font-weight:700;cursor:pointer}.status{min-height:24px;margin:12px 0 0;color:#a8deb2}</style></head>
<body><main class="wrap"><a href="index.html">← 전체 목록</a><h1>ELITE KOR 클랜 홍보글</h1><section class="card"><pre id="post"></pre><button id="copy" type="button">📋 홍보글 복사</button><p class="status" id="status" role="status"></p></section></main>
<script>const text="ELITE KOR 클랜원 모집 중\n\n1일(24시간) 미접속 시 방출 · 단톡방 필수\n\n가입 문의 >>> 27서버 엘리트 검색 <<<\n\n언제나 당신과 함께\n\n-Ex'me-";document.getElementById('post').textContent=text;document.getElementById('copy').addEventListener('click',async()=>{try{try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw Error('copy failed')}document.getElementById('status').textContent='복사했습니다.'}catch(e){document.getElementById('status').textContent='복사하지 못했습니다. 문구를 직접 선택해 복사해 주세요.'}});</script></body></html>
