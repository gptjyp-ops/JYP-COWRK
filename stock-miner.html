<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stock Miner</title>
<style>
:root{--bg:#0b0d10;--panel:#141820;--panel2:#10141b;--muted:#8f9aaa;--text:#f4f7fb;--line:#252b36;--good:#3ddc97;--warn:#ffcc66;--bad:#ff6b6b;--accent:#79a7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}.wrap{max-width:1500px;margin:0 auto;padding:22px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}.top h1{margin:0;font-size:30px}.top p{margin:6px 0 0;color:var(--muted)}.controls{display:flex;gap:8px;flex-wrap:wrap}button,input,select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px}button{cursor:pointer}.primary{background:var(--accent);color:#08101f;font-weight:800;border:0}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:18px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}.k{color:var(--muted);font-size:12px}.v{font-size:24px;font-weight:800;margin-top:5px}.tabs{display:flex;gap:8px;overflow:auto;margin:8px 0 14px}.tab{white-space:nowrap}.tab.active{background:#1e2a3c;border-color:#3b6db8}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:1150px}th,td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px;text-align:right}th{position:sticky;top:0;background:#171c25;color:#bac3d1;z-index:1}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}tr:hover{background:#171c25}.score{font-weight:900}.s80{color:var(--good)}.s70{color:var(--warn)}.pos{color:var(--good)}.neg{color:var(--bad)}.tag{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;border:1px solid var(--line)}.hot{color:var(--good)}.watch{color:var(--warn)}.wait{color:#c7ced9}.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-height:560px}.side h3{margin:0 0 8px}.side .muted{color:var(--muted);font-size:13px;line-height:1.5}.metric{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0;font-size:13px}.badge{display:inline-block;margin:4px 4px 0 0;padding:5px 8px;background:#101722;border:1px solid var(--line);border-radius:8px;font-size:11px}.reason{margin-top:12px;padding:12px;background:#10141b;border-radius:10px;line-height:1.55;font-size:13px}.footer{margin-top:14px;color:var(--muted);font-size:12px}.empty{padding:40px;color:var(--muted);text-align:center}.status{font-size:12px;color:var(--muted);margin-top:6px}@media(max-width:1050px){.cards{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}.side{min-height:auto}}@media(max-width:650px){.cards{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px}.top h1{font-size:24px}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><h1>Stock Miner</h1><p>키움 REST 기반 자동 종목 발굴 대시보드</p><div class="status" id="updated">데이터 불러오는 중...</div></div><div class="controls"><input id="q" placeholder="종목명/코드 검색"><select id="grade"><option value="all">전체 점수</option><option value="80">80점 이상</option><option value="70">70점 이상</option></select><button class="primary" id="reloadBtn">새로고침</button></div></div>
<div class="cards"><div class="card"><div class="k">전체 후보</div><div class="v" id="cAll">0</div></div><div class="card"><div class="k">집중관찰 80+</div><div class="v" id="cHot">0</div></div><div class="card"><div class="k">외국인 순매수</div><div class="v" id="cForeign">0</div></div><div class="card"><div class="k">기관 동반</div><div class="v" id="cInst">0</div></div><div class="card"><div class="k">거래량 2배+</div><div class="v" id="cVol">0</div></div><div class="card"><div class="k">이평선 근접</div><div class="v" id="cLow">0</div></div></div>
<div class="tabs" id="tabs"></div>
<div class="layout"><div class="tableWrap"><table><thead><tr><th>종목</th><th>단계</th><th>점수</th><th>현재가</th><th>등락</th><th>외국인5일</th><th>기관5일</th><th>개인5일</th><th>거래량</th><th>20일선</th><th>60일선</th><th>공시</th></tr></thead><tbody id="tbody"></tbody></table></div><aside class="side" id="detail"><h3>종목 상세</h3><p class="muted">표에서 종목을 누르면 발굴 이유와 주의 신호를 보여줍니다.</p></aside></div>
<div class="footer">현재 점수는 키움 수급·거래량·차트 기반 1차 발굴 점수입니다. DART 실적/공시는 다음 단계에서 합산합니다. ETF·리츠·거래정지/이상종목 필터도 다음 버전에 추가합니다.</div>
</div>
<script>
let rows=[];let meta={};let active='all';const tabDefs=[['all','전체'],['hot','집중관찰'],['foreign','외국인 매집'],['inst','기관 동반'],['vol','거래량 증가'],['low','이평선 근접']];
const $=id=>document.getElementById(id);const fmt=n=>(Number(n)||0).toLocaleString('ko-KR');const pct=n=>Number(n||0).toFixed(2)+'%';
function stageClass(s){if(s>=80)return'hot';if(s>=70)return'watch';return'wait'}
function matchesTab(r){if(active==='all')return true;if(active==='hot')return r.score_base>=80;if(active==='foreign')return r.foreign5>0;if(active==='inst')return r.foreign5>0&&r.inst5>0;if(active==='vol')return r.vol_ratio>=2;if(active==='low')return Math.abs(r.dist20)<=5||Math.abs(r.dist60)<=5;return true}
function renderTabs(){const el=$('tabs');el.innerHTML='';tabDefs.forEach(([k,t])=>{const b=document.createElement('button');b.className='tab'+(active===k?' active':'');b.textContent=t;b.onclick=()=>{active=k;renderTabs();render()};el.appendChild(b)})}
function render(){const q=$('q').value.trim().toLowerCase(),g=$('grade').value;let list=rows.filter(r=>(!q||r.name.toLowerCase().includes(q)||String(r.code).includes(q))&&matchesTab(r));if(g==='80')list=list.filter(r=>r.score_base>=80);if(g==='70')list=list.filter(r=>r.score_base>=70);list.sort((a,b)=>b.score_base-a.score_base);const tb=$('tbody');tb.innerHTML='';if(!list.length){tb.innerHTML='<tr><td colspan="12" class="empty">조건에 맞는 종목이 없습니다.</td></tr>'}else list.forEach(r=>{const tr=document.createElement('tr');const s=Number(r.score_base||0);tr.innerHTML=`<td><b>${r.name}</b><br><span class="k">${r.code} · ${r.theme||''}</span></td><td><span class="tag ${stageClass(s)}">${r.stage||'대기'}</span></td><td class="score ${s>=80?'s80':s>=70?'s70':''}">${s.toFixed(1)}</td><td>${fmt(r.price)}원</td><td class="${r.change>=0?'pos':'neg'}">${pct(r.change)}</td><td class="${r.foreign5>=0?'pos':'neg'}">${fmt(r.foreign5)}</td><td class="${r.inst5>=0?'pos':'neg'}">${fmt(r.inst5)}</td><td class="${r.personal5>=0?'pos':'neg'}">${fmt(r.personal5)}</td><td>${Number(r.vol_ratio||0).toFixed(2)}x</td><td>${pct(r.dist20)}</td><td>${pct(r.dist60)}</td><td>${r.disclosure||'-'}</td>`;tr.onclick=()=>showDetail(r);tb.appendChild(tr)});$('cAll').textContent=rows.length;$('cHot').textContent=rows.filter(r=>r.score_base>=80).length;$('cForeign').textContent=rows.filter(r=>r.foreign5>0).length;$('cInst').textContent=rows.filter(r=>r.foreign5>0&&r.inst5>0).length;$('cVol').textContent=rows.filter(r=>r.vol_ratio>=2).length;$('cLow').textContent=rows.filter(r=>Math.abs(r.dist20)<=5||Math.abs(r.dist60)<=5).length}
function showDetail(r){let warns=[];if(r.change>=8)warns.push('당일 급등');if(r.dist20>10)warns.push('20일선 과열');if(r.dist60>20)warns.push('60일선 이격 큼');if(r.foreign5<0)warns.push('외국인 5일 순매도');if(r.inst5<0)warns.push('기관 5일 순매도');if(r.price<=10)warns.push('가격 데이터 이상 확인 필요');$('detail').innerHTML=`<h3>${r.name}</h3><p class="muted">${r.code} · ${r.stage} · ${Number(r.score_base).toFixed(1)}점</p><div class="metric"><span>현재가</span><b>${fmt(r.price)}원</b></div><div class="metric"><span>외국인 5일</span><b>${fmt(r.foreign5)}</b></div><div class="metric"><span>기관 5일</span><b>${fmt(r.inst5)}</b></div><div class="metric"><span>외인 연속순매수 합계</span><b>${fmt(r.foreign_streak_total)}</b></div><div class="metric"><span>거래량 배수</span><b>${Number(r.vol_ratio||0).toFixed(2)}x</b></div><div class="metric"><span>20일선 이격</span><b>${pct(r.dist20)}</b></div><div class="metric"><span>60일선 이격</span><b>${pct(r.dist60)}</b></div><h3 style="margin-top:16px">발굴 이유</h3>${(r.reasons||[]).map(x=>`<span class="badge">${x}</span>`).join('')||'<span class="muted">없음</span>'}<h3 style="margin-top:16px">주의 신호</h3>${warns.map(x=>`<span class="badge">${x}</span>`).join('')||'<span class="muted">강한 경고 신호 없음</span>'}<div class="reason">${r.disclosure||''}<br>${meta.note||''}</div>`}
async function loadData(){try{const res=await fetch('data/stock-miner-data.json?ts='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);meta=await res.json();rows=Array.isArray(meta.stocks)?meta.stocks:[];$('updated').textContent=`최근 데이터: ${meta.generated_at||'-'} · ${rows.length}종목 · ${meta.version||''}`;render()}catch(e){$('updated').textContent='데이터 로드 실패: '+e.message;$('tbody').innerHTML='<tr><td colspan="12" class="empty">JSON 데이터를 불러오지 못했습니다.</td></tr>'}}
$('q').oninput=render;$('grade').onchange=render;$('reloadBtn').onclick=loadData;renderTabs();loadData();
</script></body></html>
