<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stock Miner v2</title>
<style>
:root{--bg:#0b0d10;--panel:#141820;--panel2:#10141b;--muted:#8f9aaa;--text:#f4f7fb;--line:#252b36;--good:#3ddc97;--warn:#ffcc66;--bad:#ff6b6b;--accent:#79a7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}.wrap{max-width:1500px;margin:0 auto;padding:22px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}.top h1{margin:0;font-size:30px}.top p{margin:6px 0 0;color:var(--muted)}.controls{display:flex;gap:8px;flex-wrap:wrap}button,input,select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px}button{cursor:pointer}.primary{background:var(--accent);color:#08101f;font-weight:800;border:0}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:18px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}.k{color:var(--muted);font-size:12px}.v{font-size:24px;font-weight:800;margin-top:5px}.tabs{display:flex;gap:8px;overflow:auto;margin:8px 0 14px}.tab{white-space:nowrap}.tab.active{background:#1e2a3c;border-color:#3b6db8}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:1180px}th,td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px;text-align:right}th{position:sticky;top:0;background:#171c25;color:#bac3d1;z-index:1}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}tr:hover{background:#171c25}.score{font-weight:900}.s80{color:var(--good)}.s70{color:var(--warn)}.pos{color:var(--good)}.neg{color:var(--bad)}.tag{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;border:1px solid var(--line)}.hot{color:var(--good)}.watch{color:var(--warn)}.wait{color:#c7ced9}.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-height:560px}.side h3{margin:0 0 8px}.side .muted{color:var(--muted);font-size:13px;line-height:1.5}.metric{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0;font-size:13px}.badge{display:inline-block;margin:4px 4px 0 0;padding:5px 8px;background:#101722;border:1px solid var(--line);border-radius:8px;font-size:11px}.reason{margin-top:12px;padding:12px;background:#10141b;border-radius:10px;line-height:1.55;font-size:13px}.footer{margin-top:14px;color:var(--muted);font-size:12px}.empty{padding:40px;color:var(--muted);text-align:center}
@media(max-width:1050px){.cards{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}.side{min-height:auto}}
@media(max-width:650px){.cards{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px}.top h1{font-size:24px}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><h1>Stock Miner v2</h1><p>오르기 전 후보를 찾는 자동 발굴 대시보드</p></div><div class="controls"><input id="q" placeholder="종목명 검색"><select id="grade"><option value="all">전체 점수</option><option value="80">80점 이상</option><option value="70">70점 이상</option></select><button id="csvBtn">CSV 불러오기</button><input id="csvInput" type="file" accept=".csv" hidden><button class="primary" id="exportBtn">결과 저장</button></div></div>
<div class="cards">
<div class="card"><div class="k">전체 후보</div><div class="v" id="cAll">0</div></div>
<div class="card"><div class="k">집중관찰 80+</div><div class="v" id="cHot">0</div></div>
<div class="card"><div class="k">외국인 매집</div><div class="v" id="cForeign">0</div></div>
<div class="card"><div class="k">기관 동반</div><div class="v" id="cInst">0</div></div>
<div class="card"><div class="k">실적 개선</div><div class="v" id="cProfit">0</div></div>
<div class="card"><div class="k">저점 접근</div><div class="v" id="cLow">0</div></div>
</div>
<div class="tabs" id="tabs"></div>
<div class="layout"><div class="tableWrap"><table><thead><tr><th>종목</th><th>단계</th><th>점수</th><th>현재가</th><th>등락</th><th>영업익 YoY</th><th>외국인5일</th><th>기관5일</th><th>거래량</th><th>20일선</th><th>60일선</th><th>공시</th><th>모멘텀</th></tr></thead><tbody id="tbody"></tbody></table></div><aside class="side" id="detail"><h3>종목 상세</h3><p class="muted">왼쪽 표에서 종목을 누르면 발굴 이유와 위험 신호를 보여줍니다.</p></aside></div>
<div class="footer">현재 v2는 화면/점수 엔진 단계입니다. 다음 단계에서 키움 REST + DART 데이터를 연결하면 자동 갱신형으로 바뀝니다.</div>
</div>
<script>
let rows=[
{name:'KBI메탈',price:6500,change:10.54,op_yoy:813,foreign5:820000,inst5:54000,vol_ratio:4.2,dist20:12.2,dist60:18.5,momentum:.9,risk:.9,disclosure:'긍정',theme:'구리·전선',note:'실적 급증 + 외국인 누적 순매수 + 거래량 급증. 다만 단기 과열 구간.'},
{name:'예시A',price:12450,change:2.1,op_yoy:92,foreign5:330000,inst5:120000,vol_ratio:2.4,dist20:3.5,dist60:1.2,momentum:.8,risk:1,disclosure:'보통',theme:'전력기기',note:'주가 급등 전 수급과 거래량이 먼저 개선되는 전형적인 관찰 후보.'},
{name:'예시B',price:7820,change:-.8,op_yoy:38,foreign5:190000,inst5:-20000,vol_ratio:1.8,dist20:-1.8,dist60:-4.5,momentum:.7,risk:1,disclosure:'없음',theme:'반도체',note:'저점 접근형. 외국인 매수는 있으나 기관 동반이 약함.'},
{name:'예시C',price:22100,change:7.4,op_yoy:-15,foreign5:-150000,inst5:210000,vol_ratio:3.5,dist20:15,dist60:24,momentum:.6,risk:.7,disclosure:'주의',theme:'바이오',note:'기관 매수는 있으나 실적·외국인 수급·가격 위치가 불리해 추격주의.'},
{name:'예시D',price:5340,change:1.2,op_yoy:156,foreign5:410000,inst5:86000,vol_ratio:2.9,dist20:2.2,dist60:-1.5,momentum:.85,risk:.95,disclosure:'긍정',theme:'ESS',note:'실적·수급·차트 위치가 동시에 좋아지는 신규 발굴형 예시.'}
];
const tabDefs=[['all','전체'],['new','신규 발굴'],['foreign','외국인 매집'],['inst','기관 동반'],['profit','실적 개선'],['low','저점 접근'],['disc','긍정 공시']];let active='all';
function clamp(x,a=0,b=1){return Math.max(a,Math.min(b,x))}
function score(r){const p=clamp((r.op_yoy+20)/220),f=clamp((r.foreign5+100000)/600000),i=clamp((r.inst5+50000)/300000),v=clamp((r.vol_ratio-1)/2.5),c=clamp(1-(Math.abs(r.dist20)/15)*.55-(Math.abs(r.dist60)/25)*.45),m=clamp(r.momentum),rk=clamp(r.risk);return 20*p+20*f+10*i+15*v+15*c+15*m+5*rk}
function stage(s){if(s>=80)return['집중관찰','hot'];if(s>=70)return['관찰','watch'];return['대기','wait']}
function fmt(n){return Math.round(n).toLocaleString('ko-KR')}
function matchesTab(r,s){if(active==='all')return true;if(active==='new')return s>=75&&r.change<5&&r.vol_ratio>=1.5;if(active==='foreign')return r.foreign5>0;if(active==='inst')return r.foreign5>0&&r.inst5>0;if(active==='profit')return r.op_yoy>=50;if(active==='low')return Math.abs(r.dist20)<=5||Math.abs(r.dist60)<=5;if(active==='disc')return r.disclosure==='긍정';return true}
function renderTabs(){const el=document.getElementById('tabs');el.innerHTML='';tabDefs.forEach(([k,t])=>{const b=document.createElement('button');b.className='tab'+(active===k?' active':'');b.textContent=t;b.onclick=()=>{active=k;renderTabs();render()};el.appendChild(b)})}
function render(){const q=document.getElementById('q').value.trim().toLowerCase(),g=document.getElementById('grade').value;let list=rows.map(r=>({...r,score:score(r)})).filter(r=>(!q||r.name.toLowerCase().includes(q))&&matchesTab(r,r.score));if(g==='80')list=list.filter(r=>r.score>=80);if(g==='70')list=list.filter(r=>r.score>=70);list.sort((a,b)=>b.score-a.score);const tb=document.getElementById('tbody');tb.innerHTML='';if(!list.length){tb.innerHTML='<tr><td colspan="13" class="empty">조건에 맞는 종목이 없습니다.</td></tr>'}else list.forEach(r=>{const [st,cl]=stage(r.score);const tr=document.createElement('tr');tr.innerHTML=`<td><b>${r.name}</b><br><span class="k">${r.theme||''}</span></td><td><span class="tag ${cl}">${st}</span></td><td class="score ${r.score>=80?'s80':r.score>=70?'s70':''}">${r.score.toFixed(1)}</td><td>${fmt(r.price)}원</td><td class="${r.change>=0?'pos':'neg'}">${r.change.toFixed(2)}%</td><td class="${r.op_yoy>=0?'pos':'neg'}">${r.op_yoy.toFixed(1)}%</td><td class="${r.foreign5>=0?'pos':'neg'}">${fmt(r.foreign5)}</td><td class="${r.inst5>=0?'pos':'neg'}">${fmt(r.inst5)}</td><td>${r.vol_ratio.toFixed(1)}x</td><td>${r.dist20.toFixed(1)}%</td><td>${r.dist60.toFixed(1)}%</td><td>${r.disclosure}</td><td>${Math.round(r.momentum*100)}</td>`;tr.onclick=()=>showDetail(r);tb.appendChild(tr)});const scored=rows.map(r=>({...r,score:score(r)}));cAll.textContent=rows.length;cHot.textContent=scored.filter(r=>r.score>=80).length;cForeign.textContent=rows.filter(r=>r.foreign5>0).length;cInst.textContent=rows.filter(r=>r.foreign5>0&&r.inst5>0).length;cProfit.textContent=rows.filter(r=>r.op_yoy>=50).length;cLow.textContent=rows.filter(r=>Math.abs(r.dist20)<=5||Math.abs(r.dist60)<=5).length}
function showDetail(r){const s=score(r),[st]=stage(s);let reasons=[];if(r.op_yoy>=50)reasons.push('영업이익 개선');if(r.foreign5>0)reasons.push('외국인 누적 순매수');if(r.inst5>0)reasons.push('기관 동반');if(r.vol_ratio>=2)reasons.push('거래량 증가');if(Math.abs(r.dist20)<=5||Math.abs(r.dist60)<=5)reasons.push('저점/이평선 접근');if(r.disclosure==='긍정')reasons.push('긍정 공시');let warns=[];if(r.change>=8)warns.push('당일 급등');if(r.dist20>10)warns.push('20일선 과열');if(r.foreign5<0)warns.push('외국인 순매도');if(r.risk<.8)warns.push('공시/물량 리스크');detail.innerHTML=`<h3>${r.name}</h3><p class="muted">${r.theme||''} · ${st} · ${s.toFixed(1)}점</p><div class="metric"><span>현재가</span><b>${fmt(r.price)}원</b></div><div class="metric"><span>영업이익 YoY</span><b>${r.op_yoy.toFixed(1)}%</b></div><div class="metric"><span>외국인 5일</span><b>${fmt(r.foreign5)}</b></div><div class="metric"><span>기관 5일</span><b>${fmt(r.inst5)}</b></div><div class="metric"><span>거래량 배수</span><b>${r.vol_ratio.toFixed(1)}x</b></div><h3 style="margin-top:16px">발굴 이유</h3>${reasons.map(x=>`<span class="badge">${x}</span>`).join('')||'<span class="muted">뚜렷한 발굴 신호 없음</span>'}<h3 style="margin-top:16px">주의 신호</h3>${warns.map(x=>`<span class="badge">${x}</span>`).join('')||'<span class="muted">강한 경고 신호 없음</span>'}<div class="reason">${r.note||''}</div>`}
q.oninput=render;grade.onchange=render;csvBtn.onclick=()=>csvInput.click();csvInput.onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const lines=rd.result.trim().split(/\r?\n/);const h=lines.shift().split(',').map(x=>x.trim());rows=lines.map(line=>{const v=line.split(',');let o={};h.forEach((k,i)=>o[k]=v[i]);['price','change','op_yoy','foreign5','inst5','vol_ratio','dist20','dist60','momentum','risk'].forEach(k=>o[k]=+o[k]);o.disclosure=o.disclosure||'없음';return o});render()};rd.readAsText(f,'utf-8')};exportBtn.onclick=()=>{const h=['name','score','stage','price','change','op_yoy','foreign5','inst5','vol_ratio','dist20','dist60','disclosure','theme'];const lines=[h.join(',')];rows.map(r=>({...r,score:score(r)})).sort((a,b)=>b.score-a.score).forEach(r=>lines.push([r.name,r.score.toFixed(1),stage(r.score)[0],r.price,r.change,r.op_yoy,r.foreign5,r.inst5,r.vol_ratio,r.dist20,r.dist60,r.disclosure,r.theme].join(',')));const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stock_miner_v2_results.csv';a.click();URL.revokeObjectURL(a.href)};
renderTabs();render();
</script></body></html>
