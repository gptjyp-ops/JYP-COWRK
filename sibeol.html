<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시벌클랜 클랜 홍보글 100</title>
<style>
:root{color-scheme:dark;--bg:#0f1115;--card:#171a21;--line:#2a2f3a;--text:#f5f7fb;--muted:#9aa3b2;--accent:#beee81}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}.wrap{max-width:760px;margin:0 auto;padding:16px}h1{font-size:24px;margin:6px 0 4px}.desc{color:var(--muted);margin:0 0 16px;font-size:14px}.grid{display:grid;gap:10px}.card{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px}.num{color:var(--accent);font-weight:700;margin-bottom:6px;font-size:13px}pre{margin:0;white-space:pre-wrap;word-break:keep-all;font-family:inherit;font-size:15px;line-height:1.45}button{width:100%;margin-top:10px;padding:11px 12px;border:0;border-radius:10px;font-weight:700;font-size:15px;background:#f0f3f7;color:#111;cursor:pointer}button:active{transform:scale(.99)}.top{position:sticky;top:0;z-index:10;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);padding:8px 0 10px;margin-bottom:8px}.search{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0c0e12;color:var(--text);font-size:15px}.hidden{display:none}.lang-switch{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.lang-switch button{margin:0;background:#242a35;color:#dce3ee;border:1px solid var(--line)}.lang-switch button.active{background:var(--accent);color:#071019;border-color:var(--accent)}.random-btn{width:100%;margin:0 0 10px;padding:12px;background:#beee81;color:#111;font-weight:800}.loading{color:var(--muted);padding:20px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<h1 id="pageTitle">🤡 시벌클랜 클랜 홍보글 100</h1>

<button class="random-btn" id="randomCopyBtn" onclick="randomCopy(this)">🎲 랜덤 홍보글 복사</button>
<p class="desc" id="desc">영화·속보·꽁트 등 시벌클랜 홍보글 100개입니다. 정예 1인 / 전투력 100b 이상 / 재화 관리·오더 운영 / 카카오톡 가입 문의.</p>
<input class="search" id="search" placeholder="검색: 영화, 속보, 꽁트, 서커스..." oninput="filterCards()">
</div>
<section class="grid" id="grid"><div class="loading">불러오는 중...</div></section>
</div>
<script>
const files={ko:'sibeol-array.json'};
const cache={};let currentLanguage='ko';let currentPosts=[];let lastRandomIndex=-1;
const ui={
ko:{title:'🤡 시벌클랜 클랜 홍보글 100',random:'🎲 랜덤 홍보글 복사',desc:'영화·속보·꽁트 등 시벌클랜 홍보글 100개입니다. 정예 1인 / 전투력 100b 이상 / 재화 관리·오더 운영 / 카카오톡 가입 문의.',search:'검색: 영화, 속보, 꽁트, 서커스...',copy:'📋 복사',copied:'✅ 복사됨',loading:'불러오는 중...'},
};
async function loadPosts(lang){
if(cache[lang])return cache[lang];
const res=await fetch(files[lang]+'?v=20261109-sibeol100',{cache:'no-store'});if(!res.ok)throw new Error('load failed');
const data=await res.json();cache[lang]=Array.isArray(data)?data:(data.posts||[]);return cache[lang];
}
function renderPosts(posts){
const g=document.getElementById('grid');g.innerHTML='';posts.forEach((text,i)=>{const a=document.createElement('article');a.className='card';a.innerHTML=`<div class="num">#${String(i+1).padStart(2,'0')}</div><pre id="post-${i+1}"></pre><button onclick="copyPost(${i+1},this)">${ui[currentLanguage].copy}</button>`;a.querySelector('pre').textContent=text;g.appendChild(a)});filterCards();
}
async function setLanguage(lang){
currentLanguage=lang;lastRandomIndex=-1;document.documentElement.lang=lang==='jp'?'ja':lang;
['ko'].forEach(x=>document.getElementById(x+'Btn')?.classList.toggle('active',x===lang));
const t=ui[lang];document.getElementById('pageTitle').textContent=t.title;document.getElementById('randomCopyBtn').textContent=t.random;document.getElementById('desc').textContent=t.desc;document.getElementById('search').placeholder=t.search;document.getElementById('grid').innerHTML=`<div class="loading">${t.loading}</div>`;
try{currentPosts=await loadPosts(lang);renderPosts(currentPosts)}catch(e){document.getElementById('grid').innerHTML='<div class="loading">데이터를 불러오지 못했습니다.</div>'}
}
async function writeClipboard(text){try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}}
async function copyPost(i,btn){const text=currentPosts[i-1]||'';await writeClipboard(text);const old=btn.textContent;btn.textContent=ui[currentLanguage].copied;setTimeout(()=>btn.textContent=old,1200)}
async function randomCopy(btn){if(!currentPosts.length)return;let idx;do{idx=Math.floor(Math.random()*currentPosts.length)}while(currentPosts.length>1&&idx===lastRandomIndex);lastRandomIndex=idx;await writeClipboard(currentPosts[idx]);const old=btn.textContent;btn.textContent='✅ #'+String(idx+1).padStart(2,'0')+(currentLanguage==='ko'?' 복사됨':currentLanguage==='jp'?' コピー完了':' Copied');setTimeout(()=>btn.textContent=old,1500)}
function filterCards(){const q=document.getElementById('search').value.trim().toLowerCase();document.querySelectorAll('.card').forEach(card=>card.classList.toggle('hidden',q&&!card.innerText.toLowerCase().includes(q)))}
setLanguage('ko');
</script>
</body>
</html>
