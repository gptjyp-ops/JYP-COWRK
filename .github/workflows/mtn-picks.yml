name: MTN Yeouido Picks

on:
  push:
    paths:
      - mtn_picks_collect.py
      - stock_miner_watchlist.py
      - data/mtn-picks.json
      - .github/workflows/mtn-picks.yml
  workflow_dispatch:
  schedule:
    # 한국시간 평일 22:30 - 여의도 투자본부 1·2부 방송 후
    - cron: '30 13 * * 1-5'

concurrency:
  group: stock-miner-mtn-picks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect MTN picks
        run: python mtn_picks_collect.py

      - name: Refresh MTN pick investor flow
        run: python watch_flow_collect.py

      - name: Refresh MTN pick news
        run: python news_collect.py --watch-only

      - name: Commit MTN picks and refreshed data
        run: |
          git add data/mtn-picks.json data/watch-investor-flow.json data/news-momentum.json data/news-momentum-status.json
          if git diff --cached --quiet; then
            echo "No MTN pick changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update MTN Yeouido picks"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
