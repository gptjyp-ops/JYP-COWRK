name: News Momentum

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */2 * * *'

permissions:
  contents: write

jobs:
  collect-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect news momentum
        run: python news_collect.py

      - name: Commit updated news data
        run: |
          if git diff --quiet -- data/news-momentum.json; then
            echo "No news data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news-momentum.json
          git commit -m "Update news momentum data"
          git push
