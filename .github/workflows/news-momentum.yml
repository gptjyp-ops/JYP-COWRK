name: News Momentum

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */2 * * *'

permissions:
  contents: write

jobs:
  collect-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check data integrity rules
        run: python -m unittest test_data_integrity test_momentum_themes test_news_recovery

      - name: Collect news momentum
        id: collect
        run: python news_collect.py

      - name: Commit updated news data
        if: success() || (failure() && steps.collect.outcome == 'failure')
        run: |
          git add data/news-momentum.json data/news-momentum-status.json
          if git diff --cached --quiet; then
            echo "No news data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update news momentum data"
          git pull --rebase origin main
          git push origin HEAD:main

