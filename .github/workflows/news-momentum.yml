name: News Momentum

on:
  push:
    paths:
      - news_collect.py
      - .github/workflows/news-momentum.yml
  workflow_dispatch:
  schedule:
    - cron: '15 */2 * * *'
    # 한국시간 평일 09:00~15:59, 관심종목만 5분 간격으로 조회합니다.
    - cron: '2-57/5 0-6 * * 1-5'

concurrency:
  group: news-momentum
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check data integrity rules
        run: python -m unittest test_data_integrity test_momentum_themes test_news_recovery test_momentum_tracking test_news_ranking

      - name: Check news ranking
        run: node test_news_ranking.cjs

      - name: Collect news momentum
        id: collect
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$SCHEDULE" = '2-57/5 0-6 * * 1-5' ] || [ "$EVENT_NAME" = 'push' ]; then
            python news_collect.py --watch-only
          else
            python news_collect.py
          fi

      - name: Commit updated news data
        if: success() || (failure() && steps.collect.outcome == 'failure')
        run: |
          git add data/news-momentum.json data/news-momentum-status.json
          if git diff --cached --quiet; then
            echo "No news data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update news momentum data"
          git pull --rebase origin main
          git push origin HEAD:main
