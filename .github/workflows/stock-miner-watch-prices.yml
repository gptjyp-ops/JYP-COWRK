name: Stock Miner Watch Prices

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_stock_miner_watch_market.py'
      - 'data/stock-miner-watchlist.json'
      - '.github/workflows/stock-miner-watch-prices.yml'
  schedule:
    # KST weekdays 09:00-15:59 every 20 minutes, plus a 16:10 closing refresh.
    - cron: '*/20 0-6 * * 1-5'
    - cron: '10 7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: stock-miner-watch-prices
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install market data client
        run: python -m pip install --disable-pip-version-check yfinance==0.2.66
      - name: Refresh watchlist prices
        run: python scripts/update_stock_miner_watch_market.py
      - name: Commit watchlist market data
        run: |
          git add data/stock-miner-watch-market.json
          if git diff --cached --quiet; then
            echo "No market data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh Stock Miner watch prices"
          git pull --rebase origin main
          git push origin HEAD:main
