<p class="intro">좋은 말만 해주는 상담은 끝. 당신과 성격이 맞는 녀석을 고르고, 고민을 정면으로 던져보세요.</p>
<div class="step">01 · 상담할 녀석을 골라</div>
<section class="people" id="people">
<button class="person active" data-i="0"><span class="portrait"></span><span class="pname">류지</span><span class="ptype">직진형 · 팩트폭격</span></button>
<button class="person" data-i="1"><span class="portrait"></span><span class="pname">테츠</span><span class="ptype">의리형 · 현실조언</span></button>
<button class="person" data-i="2"><span class="portrait"></span><span class="pname">미키</span><span class="ptype">갸루형 · 연애감지</span></button>
<button class="person" data-i="3"><span class="portrait"></span><span class="pname">레이</span><span class="ptype">냉정형 · 속마음</span></button>
<button class="person" data-i="4"><span class="portrait"></span><span class="pname">렌</span><span class="ptype">밀당형 · 관계분석</span></button>
</section>
<section class="box"><label for="q">02 · 고민을 숨기지 말고 적어</label><textarea id="q" maxlength="180" placeholder="예: 연락을 기다리는 게 맞을까, 내가 먼저 해야 할까?"></textarea><div class="chips"><button class="chip active" data-t="연애">연애</button><button class="chip" data-t="재회">재회</button><button class="chip" data-t="직장">직장</button><button class="chip" data-t="돈">돈</button><button class="chip" data-t="관계">인간관계</button></div><button class="go" id="start">카드판 엎어보기</button></section>
<p class="guide" id="guide">질문을 적으면 카드가 깨어난다.</p><section class="deck" id="deck"></section>
<section class="result" id="result"><div class="speech"><div class="who" id="who"></div><h2 id="headline"></h2><div class="readings" id="readings"></div><div class="final" id="final"></div><button class="again" id="again">다른 고민 던지기</button></div></section>
<p class="notice">재미와 자기 성찰을 위한 카툰 타로 체험입니다. 의료·법률·투자 판단은 전문가와 실제 자료를 확인하세요.</p></main>
<script>
const advisors=[
{name:"류지",open:"돌려 말 안 한다. 카드대로 간다.",tone:"결론부터 말하면",act:"애매하게 기다리지 말고 네 기준을 먼저 말해."},
{name:"테츠",open:"센 척은 그만. 진짜 지켜야 할 걸 보자.",tone:"현실적으로 보면",act:"오늘 할 수 있는 작은 행동 하나부터 끝내."},
{name:"미키",open:"사랑은 눈치가 아니라 온도야. 내가 봐줄게.",tone:"느낌 딱 오는데",act:"상대 반응만 보지 말고 네 마음도 예쁘게 표현해."},
{name:"레이",open:"보고 싶은 것 말고, 드러난 사실을 봐.",tone:"차갑게 정리하면",act:"말과 행동이 같은지 일주일만 관찰해."},
{name:"렌",open:"관계는 타이밍이 반, 솔직함이 반이지.",tone:"흐름을 읽어보면",act:"밀당 대신 상대가 답할 수 있는 질문 하나를 던져."}
];
const cards=[
["돌진","⚡","멈춘 흐름을 깨는 힘이 들어온다. 다만 속도보다 방향이 먼저다."],
["의리","🤝","혼자 버티기보다 믿을 사람과 약속을 확인해야 한다."],
["허세","♠","겉으로 강한 모습 뒤에 불안이 숨어 있다. 말보다 행동을 보자."],
["고백","♥","솔직한 표현이 관계의 공기를 바꿀 수 있다."],
["거리","↔","잠시 떨어져 보는 것이 감정을 더 선명하게 만든다."],
["재회","↩","과거가 다시 오지만, 예전 방식 그대로면 같은 문제가 반복된다."],
["선택","✦","둘 다 잡으려 하지 말고 무엇을 포기할지 결정할 때다."],
["질투","🔥","강한 감정이 사실을 흐린다. 비교보다 원하는 것을 정확히 보자."],
["반전","★","예상하지 못한 말이나 기회가 흐름을 바꿀 수 있다."],
["경계","⛓","끌림과 집착을 구분해야 한다. 불편함을 무시하지 마라."],
["회복","☀","상처가 중심이던 시간이 지나고 자신감이 돌아온다."],
["침묵","☾","아직 드러나지 않은 정보가 있다. 성급한 결론은 보류하자."],
["정면승부","拳","피하지 않고 대화하면 생각보다 단순하게 풀릴 수 있다."],
["끝장","✂","이미 끝난 방식을 놓아야 새로운 관계가 들어온다."],
["대박","◎","준비해온 일이 연결된다. 기회가 왔을 때 잡을 준비를 하자."]
];
let advisor=0,topic="연애",picked=[],pool=[];
const d=document.getElementById("deck"),q=document.getElementById("q"),guide=document.getElementById("guide");
document.querySelectorAll(".person").forEach(b=>b.onclick=()=>{document.querySelectorAll(".person").forEach(x=>x.classList.remove("active"));b.classList.add("active");advisor=+b.dataset.i});
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));b.classList.add("active");topic=b.dataset.t});
function render(on=false){pool=[...cards].sort(()=>Math.random()-.5).slice(0,5);picked=[];d.innerHTML="";pool.forEach((c,i)=>{let b=document.createElement("button");b.className="card";b.disabled=!on;b.innerHTML='<span class="cardin"><span class="face back">夜露死苦</span><span class="face front"><i>'+c[1]+'</i><b>'+c[0]+'</b></span></span>';b.onclick=()=>pick(b,c);d.appendChild(b)})}
function pick(b,c){if(b.classList.contains("open")||picked.length===3)return;b.classList.add("open");b.disabled=true;picked.push(c);guide.textContent=picked.length<3?"한 장 더. 직감대로 가.":"좋아, 세 장 다 나왔다.";if(picked.length===3){document.querySelectorAll(".card:not(.open)").forEach(x=>x.disabled=true);setTimeout(show,500)}}
function show(){const a=advisors[advisor],pos=["지나온 판","현재 승부처","다음 흐름"];document.getElementById("who").textContent=a.name+"의 한마디 · "+a.open;document.getElementById("headline").textContent='"'+q.value.trim()+'"';document.getElementById("readings").innerHTML=picked.map((c,i)=>'<article class="reading"><small>'+pos[i]+'</small><h3>'+c[1]+' '+c[0]+'</h3><p>'+c[2]+'</p></article>').join("");document.getElementById("final").innerHTML='<b>'+a.tone+'</b>, '+picked[0][0]+'에서 시작된 상황이 '+picked[1][0]+'을 지나 '+picked[2][0]+' 쪽으로 움직인다. '+topic+' 문제의 핵심은 상대 마음을 맞히는 게 아니라 네 선택을 분명히 하는 것. <b>'+a.act+'</b>';document.getElementById("result").classList.add("show");document.getElementById("result").scrollIntoView({behavior:"smooth",block:"start"})}
document.getElementById("start").onclick=()=>{if(!q.value.trim()){q.focus();guide.textContent="고민부터 적어. 빈말은 카드도 못 읽어.";return}document.getElementById("result").classList.remove("show");render(true);guide.textContent="눈이 가는 카드 세 장을 골라.";document.getElementById("start").textContent="다시 섞기"};
document.getElementById("again").onclick=()=>{q.value="";render(false);document.getElementById("result").classList.remove("show");guide.textContent="질문을 적으면 카드가 깨어난다.";window.scrollTo({top:0,behavior:"smooth"})};render(false);
</script></body></html>
